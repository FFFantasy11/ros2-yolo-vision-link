<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="系统全景图：摄像头经 USB 连树莓派，树莓派经网线连主机，主机经 WiFi 连浏览器">
  <rect width="880" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a949b"/>
    </marker>
  </defs>

  <!-- 摄像头 -->
  <rect x="8" y="54" width="126" height="150" rx="10" fill="#ffffff" stroke="#e4e2dc"/>
  <text x="71" y="78" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f23">① 摄像头</text>
  <text x="71" y="102" font-size="10" text-anchor="middle" fill="#6b757d">USB 免驱</text>
  <text x="71" y="119" font-size="10" text-anchor="middle" fill="#6b757d">640 × 480</text>
  <text x="71" y="136" font-size="10" text-anchor="middle" fill="#6b757d">每秒 20 张</text>
  <line x1="26" y1="150" x2="116" y2="150" stroke="#f0eee9"/>
  <text x="71" y="172" font-size="9.5" text-anchor="middle" fill="#a8334a">只会拍</text>
  <text x="71" y="187" font-size="9.5" text-anchor="middle" fill="#a8334a">不会认</text>

  <!-- 箭头 1 -->
  <line x1="136" y1="140" x2="176" y2="140" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="156" y="124" font-size="9.5" text-anchor="middle" fill="#1d5b8a" font-weight="600">USB</text>
  <text x="156" y="158" font-size="9" text-anchor="middle" fill="#6b757d">12 MB/s</text>

  <!-- 树莓派 -->
  <rect x="182" y="38" width="170" height="182" rx="10" fill="#ffffff" stroke="#e4e2dc"/>
  <text x="267" y="62" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f23">② 树莓派 5</text>
  <text x="267" y="88" font-size="10" text-anchor="middle" fill="#39424a">从驱动取原始帧</text>
  <text x="267" y="106" font-size="10" text-anchor="middle" fill="#39424a">压成 JPEG</text>
  <text x="267" y="124" font-size="10" text-anchor="middle" fill="#39424a">发到网线上</text>
  <line x1="200" y1="138" x2="334" y2="138" stroke="#f0eee9"/>
  <text x="267" y="160" font-size="9.5" text-anchor="middle" fill="#2c7350">只搬运</text>
  <text x="267" y="175" font-size="9.5" text-anchor="middle" fill="#2c7350">不思考</text>
  <text x="267" y="198" font-size="9" text-anchor="middle" fill="#6b757d" font-family="monospace">192.168.10.2</text>

  <!-- 箭头 2 -->
  <line x1="354" y1="140" x2="394" y2="140" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="374" y="124" font-size="9.5" text-anchor="middle" fill="#1d5b8a" font-weight="600">网线</text>
  <text x="374" y="158" font-size="9" text-anchor="middle" fill="#6b757d">0.2 ms</text>

  <!-- 主机 -->
  <rect x="400" y="26" width="200" height="206" rx="10" fill="#ffffff" stroke="#e4e2dc"/>
  <text x="500" y="50" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f23">③ 主机（大脑）</text>

  <rect x="412" y="60" width="176" height="30" rx="6" fill="#f5f4f0" stroke="#e4e2dc"/>
  <text x="500" y="79" font-size="10" text-anchor="middle" fill="#39424a">JPEG 解压成像素</text>

  <rect x="412" y="96" width="176" height="46" rx="6" fill="#e6f2ec" stroke="#c3e0d2"/>
  <text x="500" y="115" font-size="10" text-anchor="middle" fill="#1b1f23" font-weight="600">YOLOv8 认出物体</text>
  <text x="500" y="131" font-size="9" text-anchor="middle" fill="#2c7350">17 毫秒 / 帧</text>

  <rect x="412" y="148" width="176" height="30" rx="6" fill="#f5f4f0" stroke="#e4e2dc"/>
  <text x="500" y="167" font-size="10" text-anchor="middle" fill="#39424a">打包 + 推流</text>

  <text x="500" y="198" font-size="9.5" text-anchor="middle" fill="#2c7350">会认 80 类东西</text>
  <text x="500" y="216" font-size="9" text-anchor="middle" fill="#6b757d" font-family="monospace">http://&lt;主机IP&gt;:8000</text>

  <!-- 箭头 3 -->
  <line x1="602" y1="140" x2="642" y2="140" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="622" y="124" font-size="9.5" text-anchor="middle" fill="#1d5b8a" font-weight="600">WiFi</text>
  <text x="622" y="158" font-size="9" text-anchor="middle" fill="#6b757d">网页</text>

  <!-- 浏览器 -->
  <rect x="646" y="54" width="126" height="150" rx="10" fill="#ffffff" stroke="#e4e2dc"/>
  <text x="709" y="78" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1b1f23">④ 浏览器</text>
  <text x="709" y="102" font-size="10" text-anchor="middle" fill="#6b757d">贴原图</text>
  <text x="709" y="119" font-size="10" text-anchor="middle" fill="#6b757d">再画框</text>
  <line x1="664" y1="134" x2="754" y2="134" stroke="#f0eee9"/>
  <text x="709" y="156" font-size="9.5" text-anchor="middle" fill="#2c7350">不用装</text>
  <text x="709" y="171" font-size="9.5" text-anchor="middle" fill="#2c7350">任何软件</text>

  <line x1="8" y1="240" x2="872" y2="240" stroke="#e4e2dc" stroke-dasharray="2 4"/>
  <text x="8" y="262" font-size="10.5" fill="#39424a">四台设备、三段链路、两台机器：树莓派在房间那头，主机在桌上，浏览器在另一台机器上。</text>
  <text x="8" y="282" font-size="10.5" fill="#6b757d">任何一处断掉，浏览器里就只剩一片空白 —— 这也是排查故障时永远从「链路」而不是「代码」查起的原因。</text>
</svg>

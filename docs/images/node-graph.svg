<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-label="三个节点通过话题总线协作的关系图">
  <rect width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a949b"/>
    </marker>
  </defs>

  <text x="440" y="18" font-size="10.5" text-anchor="middle" fill="#6b757d">树莓派 5（在房间那头）</text>

  <rect x="250" y="26" width="380" height="84" rx="10" fill="#ffffff" stroke="#c9dceb"/>
  <text x="440" y="52" font-size="13" font-weight="600" text-anchor="middle" fill="#1b1f23">vision_cam　（C++）</text>
  <text x="440" y="72" font-size="9.5" text-anchor="middle" fill="#39424a">USB 摄像头 → 取帧 → 压 JPEG → 贴到公告板上</text>
  <text x="440" y="90" font-size="9" text-anchor="middle" fill="#2c7350">开机自启，不需要登录，也不管有没有人在看</text>

  <line x1="440" y1="110" x2="440" y2="140" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="450" y="130" font-size="9" fill="#6b757d">发布</text>

  <!-- 话题 -->
  <rect x="170" y="144" width="540" height="50" rx="10" fill="#e9f1f7" stroke="#c9dceb"/>
  <text x="440" y="166" font-size="12" text-anchor="middle" fill="#1d5b8a" font-weight="600" font-family="monospace">话题 /image_raw/compressed</text>
  <text x="440" y="183" font-size="9.5" text-anchor="middle" fill="#39424a">每秒贴 20 次，每次约 40 KB —— 谁想看谁自己来拿</text>

  <line x1="270" y1="194" x2="270" y2="238" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="610" y1="194" x2="610" y2="238" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 主机范围 -->
  <rect x="96" y="216" width="690" height="148" rx="12" fill="none" stroke="#c9c6be" stroke-dasharray="5 5"/>
  <text x="110" y="234" font-size="9.5" fill="#6b757d">主机（上位机）· Ubuntu 24.04</text>

  <rect x="110" y="244" width="290" height="104" rx="9" fill="#ffffff" stroke="#c9dceb"/>
  <text x="126" y="268" font-size="12" font-weight="600" fill="#1b1f23">vision_detect　（Python）</text>
  <text x="126" y="289" font-size="9.5" fill="#39424a">订阅 · 取帧 → 识别 → 推给网页</text>
  <text x="126" y="308" font-size="9.5" fill="#39424a">同时扮演「网页服务器」，端口 8000</text>
  <text x="126" y="328" font-size="9" fill="#2c7350">一台机器只跑这一份，多开的浏览器共用它</text>

  <rect x="482" y="244" width="290" height="104" rx="9" fill="#ffffff" stroke="#c9dceb"/>
  <text x="498" y="268" font-size="12" font-weight="600" fill="#1b1f23">vision_probe　（C++）</text>
  <text x="498" y="289" font-size="9.5" fill="#39424a">订阅 · 只听不算，专门测速</text>
  <text x="498" y="308" font-size="9.5" fill="#39424a">统计帧率、带宽、延迟、卡顿</text>
  <text x="498" y="328" font-size="9" fill="#6b757d">平时不运行，怀疑链路有问题时才手动跑</text>

  <line x1="255" y1="348" x2="255" y2="388" stroke="#8a949b" stroke-width="1.6" marker-end="url(#a2)"/>
  <text x="265" y="372" font-size="9" fill="#6b757d">WebSocket</text>

  <rect x="110" y="390" width="290" height="56" rx="9" fill="#ffffff" stroke="#e4e2dc"/>
  <text x="255" y="414" font-size="12" font-weight="600" text-anchor="middle" fill="#1b1f23">浏览器（另一台电脑 / 手机）</text>
  <text x="255" y="433" font-size="9.5" text-anchor="middle" fill="#6b757d" font-family="monospace">http://&lt;主机IP&gt;:8000</text>

  <text x="482" y="400" font-size="9.5" fill="#6b757d">两个订阅者互不相识，</text>
  <text x="482" y="416" font-size="9.5" fill="#6b757d">再加第三个也不会影响前两个。</text>
  <text x="482" y="436" font-size="9.5" fill="#1d5b8a">这就是「话题」的全部意义：一对多，零耦合。</text>
</svg>

# 追加到树莓派 /etc/chrony/chrony.conf 末尾（向主机对时）
#
# 注意：当前机器上这一行被重复写入了 4 次（历史脚本重复执行导致）。
# 不影响功能，但属于冗余，清理方法：
#   sudo sed -i '/server 192.168.10.1 iburst prefer/d' /etc/chrony/chrony.conf
#   sudo bash -c 'echo "server 192.168.10.1 iburst prefer" >> /etc/chrony/chrony.conf'
#   sudo systemctl restart chrony
#
# 验证：chronyc sources -v  应看到 192.168.10.1 带 * 号
#       实测对时后两机偏差 -85µs 量级
server 192.168.10.1 iburst prefer

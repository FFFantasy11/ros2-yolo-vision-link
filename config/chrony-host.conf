# 追加到主机 /etc/chrony/chrony.conf 末尾（主机当 NTP 服务器给 Pi 对时）
#
# 为什么需要：Pi 只插网线、网关留空，没有互联网时间源。
# 而"端到端延迟"这个指标 = 主机收帧时刻 - Pi 打时间戳时刻，
# 两机时钟不同步时这个数字完全不可信（实测未对时时偏差可达 85ms）。
#
# 生效步骤：
#   sudo tee -a /etc/chrony/chrony.conf <<'EOF'
allow 192.168.10.0/24
local stratum 8
#   EOF
#   sudo systemctl restart chrony
allow 192.168.10.0/24
local stratum 8
